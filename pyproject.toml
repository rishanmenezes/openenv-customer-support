[project]
name = "openenv-customer-support"
version = "0.1.0"
description = "Smart Customer Support Ticket Resolution OpenEnv Environment"
authors = [{ name = "Rishan Menezes" }]
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "openai",
    "httpx",
    "openenv-core>=0.2.0",
]
requires-python = ">=3.10"

[project.scripts]
server = "server.app:main"

[tool.setuptools]
packages = ["api", "env", "baseline", "server"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
