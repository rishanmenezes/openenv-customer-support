[project]
name = "openenv-customer-support"
version = "0.1.0"
description = "Smart Customer Support Ticket Resolution OpenEnv Environment"
authors = [
    { name = "Rishan Menezes" }
]
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "openai",
    "httpx"
]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
